<!DOCTYPE html>
<html lang="pt-BR">
   <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONVERGE - Login</title>

  <link rel="stylesheet" href="CSS/variables.css">
  <link rel="stylesheet" href="CSS/reset-base.css">
  <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" as="script">
    <script>
        // Promise pública que resolve quando o script do Clerk carregar — usado para acelerar inicialização
        (function () {
            if (window._clerkLoaded) return;
            window._clerkLoaded = new Promise((resolve, reject) => {
                const existing = document.querySelector('script[src*="clerk.browser.js"]');
                function attach(s) {
                    if (!s) return;
                    if (s.__clerkListenerAttached) return;
                    s.__clerkListenerAttached = true;
                    s.addEventListener('load', () => resolve(true));
                    s.addEventListener('error', () => reject(new Error('Falha ao carregar Clerk')));
                    if (s.readyState === 'complete') resolve(true);
                }
                if (existing) {
                    attach(existing);
                } else {
                    // cria e injeta o script o mais cedo possível
                    const s = document.createElement('script');
                    s.async = true;
                    s.crossOrigin = 'anonymous';
                    s.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
                    // mantém a chave publishable no atributo quando presente no body
                    const key = document.body?.getAttribute('data-clerk-publishable-key');
                    if (key) s.setAttribute('data-clerk-publishable-key', key);
                    attach(s);
                    document.head.appendChild(s);
                }
                // safety timeout
                setTimeout(() => resolve(false), 8000);
            });
        })();
    </script>
    <script id="clerk-sdk" async crossorigin="anonymous" data-clerk-publishable-key="pk_test_bWF4aW11bS1zbmlwZS0yMS5jbGVyay5hY2NvdW50cy5kZXYk" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
</head>
<body class="login-page" data-clerk-publishable-key="pk_test_bWF4aW11bS1zbmlwZS0yMS5jbGVyay5hY2NvdW50cy5kZXYk">
    <div class="login-topbar">
        <div class="logo-box brand-safe-area">
            <div class="brand-logo">
                <img id="hcfmuspLogo" class="brand-logo-img brand-logo-hcfmusp" src="LOGO HCFMUSP.png" alt="Logo HCFMUSP" />
            </div>
        </div>
        <div class="logo-box ceac-logo-box brand-safe-area">
            <div class="brand-logo">
                <img id="ceacLogo" class="brand-logo-img brand-logo-ceac" src="Logo CeAC Azul e Turqueza Sem Fundo.png" alt="Logo CeAC" />
            </div>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">CONVERGE</h1>

            </div>

            <div class="login-form">
                <div class="error-message" style="display:none"></div>

                <p class="login-info">Acesse com sua conta institucional</p>
                <button id="loginBtn" class="google-signin-btn" type="button">Entrar com Clerk</button>
            </div>

            <div class="login-footer">
                <p class="security-badge">Acesso seguro e protegido</p>
            </div>
        </div>

        <div class="login-branding">
            <p>CONVERGE | CeAC HCFMUSP</p>
            <p>Centro de Atenção à Saúde do Colaborador - HCFMUSP</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
